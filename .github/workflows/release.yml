name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v0.1.0-alpha.4)
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release-alpha4]')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0-alpha.4') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Install release build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross unzip zip
      - name: Verify backend
        run: |
          go test ./...
          go vet ./...
      - name: Build and verify frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm build
      - name: Build amd64 package
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          COMMIT: ${{ github.sha }}
          GOARCH: amd64
        run: sh scripts/release/build-linux.sh
      - name: Build arm64 package
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          COMMIT: ${{ github.sha }}
          GOARCH: arm64
          CC: aarch64-linux-gnu-gcc
        run: sh scripts/release/build-linux.sh
      - name: Build full offline bundles
        run: |
          set -eu
          for ubuntu in 22.04 24.04 26.04; do
            for arch in amd64 arm64; do
              VERSION="${RELEASE_VERSION}" UBUNTU_VERSION="${ubuntu}" ARCHITECTURE="${arch}" sh scripts/release/build-offline-bundle.sh
            done
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_VERSION}" \
            dist/egress-manager-linux-amd64.tar.gz \
            dist/egress-manager-linux-amd64.tar.gz.sha256 \
            dist/egress-manager-linux-arm64.tar.gz \
            dist/egress-manager-linux-arm64.tar.gz.sha256 \
            dist/egress-manager-offline-ubuntu*.zip \
            dist/egress-manager-offline-ubuntu*.zip.sha256 \
            dist/egress-manager-offline-ubuntu*.tar.gz \
            dist/egress-manager-offline-ubuntu*.tar.gz.sha256 \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Egress Manager ${RELEASE_VERSION}" \
            --notes "Alpha.4 full bundle with repaired ZIP bootstrap, direct browser HTTP mode, the egress-manager shell management command, the prebuilt browser panel, pinned sing-box and Xray runtimes, and per-Ubuntu offline dependency archives. Target hosts do not require Node/npm/pnpm. Plain HTTP is an explicit insecure compatibility mode and does not encrypt administrator credentials or sessions."
