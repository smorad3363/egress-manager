name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true
      - name: Install arm64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Verify backend
        run: |
          go test ./...
          go vet ./...
      - name: Build amd64 archive
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GOARCH: amd64
        run: sh scripts/release/build-linux.sh
      - name: Build arm64 archive
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GOARCH: arm64
          CC: aarch64-linux-gnu-gcc
        run: sh scripts/release/build-linux.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/egress-manager-linux-amd64.tar.gz
          dist/egress-manager-linux-amd64.tar.gz.sha256
          dist/egress-manager-linux-arm64.tar.gz
          dist/egress-manager-linux-arm64.tar.gz.sha256
          --prerelease
          --title "Egress Manager ${GITHUB_REF_NAME}"
          --notes "Alpha release for Ubuntu 22.04, 24.04, and 26.04. The browser UI is not yet bundled."
