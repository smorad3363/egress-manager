name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v0.1.0-alpha.10)
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release-alpha10]')
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0-alpha.10') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Install release build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross unzip zip
      - name: Verify backend
        run: |
          go test ./...
          go vet ./...
      - name: Verify listener relay against pinned Xray 26.7.28
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          curl --fail --location --silent --show-error \
            https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip \
            --output "${tmp}/xray.zip"
          printf '%s  %s\n' \
            '8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40' \
            "${tmp}/xray.zip" | sha256sum -c -
          unzip -q "${tmp}/xray.zip" -d "${tmp}/xray"
          chmod 0755 "${tmp}/xray/xray"
          XRAY_NATIVE_BINARY="${tmp}/xray/xray" go test ./internal/xrayrelay -run '^TestNative' -count=1
      - name: Build and verify frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm build
      - name: Build amd64 package
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          COMMIT: ${{ github.sha }}
          GOARCH: amd64
        run: sh scripts/release/build-linux.sh
      - name: Build arm64 package
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          COMMIT: ${{ github.sha }}
          GOARCH: arm64
          CC: aarch64-linux-gnu-gcc
        run: sh scripts/release/build-linux.sh
      - name: Build full offline bundles
        run: |
          set -eu
          for ubuntu in 22.04 24.04 26.04; do
            for arch in amd64 arm64; do
              VERSION="${RELEASE_VERSION}" UBUNTU_VERSION="${ubuntu}" ARCHITECTURE="${arch}" sh scripts/release/build-offline-bundle.sh
            done
          done
          for checksum in dist/egress-manager-offline-ubuntu*.sha256; do
            (cd dist && sha256sum -c "$(basename "${checksum}")")
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_VERSION}" \
            dist/egress-manager-linux-amd64.tar.gz \
            dist/egress-manager-linux-amd64.tar.gz.sha256 \
            dist/egress-manager-linux-arm64.tar.gz \
            dist/egress-manager-linux-arm64.tar.gz.sha256 \
            dist/egress-manager-offline-ubuntu*.zip \
            dist/egress-manager-offline-ubuntu*.zip.sha256 \
            dist/egress-manager-offline-ubuntu*.tar.gz \
            dist/egress-manager-offline-ubuntu*.tar.gz.sha256 \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Egress Manager ${RELEASE_VERSION}" \
            --notes "Alpha.10 makes the Xray boundary fully project-owned. The production Xray console now shows only Egress Manager-managed Xray outbounds, listener relays, and owned runtime paths. Normal startup and health monitoring no longer inspect standalone Xray, Marzban, 3x-ui/Sanaei, or other proxy-panel configuration or services through the legacy discovery catalog. Managed relays continue to use the bundled Xray runtime, private Egress Manager configuration, isolated egress-manager-xray-relay.service, atomic apply/rollback/recovery, and fail-closed behavior. Alpha.10 also restores the installed VERSION marker and verifies it against the running daemon. Existing Egress Manager database, administrator accounts, TLS material, management port, and package-preservation protections are retained across repeat secure installs."