name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true
      - run: go test ./...
      - run: go vet ./...

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  network-lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true
      - name: Install isolated network test dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y iproute2 iptables nftables procps socat
      - name: Build read-only inventory probe
        run: go build -trimpath -o /tmp/egress-inventory-probe ./tests/network/inventoryprobe
      - name: Build NAT plan probe
        run: go build -trimpath -o /tmp/egress-nat-probe ./tests/network/natprobe
      - name: Run repeatable namespace lab
        run: sudo EGRESS_INVENTORY_PROBE=/tmp/egress-inventory-probe EGRESS_NAT_PROBE=/tmp/egress-nat-probe tests/network/run.sh
