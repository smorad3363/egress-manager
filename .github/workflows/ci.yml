name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true
      - run: go test ./...
      - run: go vet ./...

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  network-lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned network lab
        run: docker build --tag egress-manager-network-lab --file tests/network/Dockerfile .
      - name: Run repeatable namespace lab
        run: docker run --rm --privileged egress-manager-network-lab
