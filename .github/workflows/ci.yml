name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Verify listener relay against pinned Xray 26.7.28
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          curl --fail --location --silent --show-error \
            https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip \
            --output "${tmp}/xray.zip"
          printf '%s  %s\n' \
            '8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40' \
            "${tmp}/xray.zip" | sha256sum -c -
          unzip -q "${tmp}/xray.zip" -d "${tmp}/xray"
          chmod 0755 "${tmp}/xray/xray"
          XRAY_NATIVE_BINARY="${tmp}/xray/xray" go test ./internal/xrayrelay -run '^TestNative' -count=1
      - name: Verify installer shell syntax
        run: sh -n scripts/install/install.sh scripts/install/install-secure.sh scripts/release/build-offline-bundle.sh

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  ubuntu-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip zip
      - name: Build browser panel
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build installer package
        env:
          VERSION: ci
          COMMIT: ${{ github.sha }}
          GOARCH: amd64
        run: sh scripts/release/build-linux.sh
      - name: Build matching offline bundle
        env:
          VERSION: ci
        run: |
          target="${{ matrix.os }}"
          ubuntu="${target#ubuntu-}"
          UBUNTU_VERSION="${ubuntu}" ARCHITECTURE=amd64 sh scripts/release/build-offline-bundle.sh
      - name: Verify portable release checksum
        run: |
          target="${{ matrix.os }}"
          ubuntu="${target#ubuntu-}"
          bundle="egress-manager-offline-ubuntu${ubuntu}-amd64"
          test "$(awk 'NR==1 {print $2}' "dist/${bundle}.zip.sha256")" = "${bundle}.zip"
          (cd dist && sha256sum -c "${bundle}.zip.sha256")
      - name: Create foreign proxy-panel sentinels
        run: |
          sudo install -d -m 0755 /etc/xray /var/lib/marzban /usr/local/x-ui/bin
          printf '%s\n' '{"marker":"foreign-standalone-xray"}' | sudo tee /etc/xray/config.json >/dev/null
          printf '%s\n' '{"marker":"foreign-marzban"}' | sudo tee /var/lib/marzban/xray_config.json >/dev/null
          printf '%s\n' '{"marker":"foreign-3x-ui"}' | sudo tee /usr/local/x-ui/bin/config.json >/dev/null
          for service in xray marzban x-ui; do
            sudo tee "/etc/systemd/system/${service}.service" >/dev/null <<EOF
          [Unit]
          Description=Foreign proxy panel sentinel ${service}
          [Service]
          Type=simple
          ExecStart=/usr/bin/sleep 3600
          Restart=no
          EOF
          done
          sudo systemctl daemon-reload
          sudo systemctl start xray.service marzban.service x-ui.service
          sudo sha256sum /etc/xray/config.json /var/lib/marzban/xray_config.json /usr/local/x-ui/bin/config.json > /tmp/foreign-proxy-files.sha256
          for service in xray marzban x-ui; do
            printf '%s=%s\n' "${service}" "$(systemctl show --property=MainPID --value "${service}.service")"
          done > /tmp/foreign-proxy-pids.before
      - name: Snapshot installed host packages
        run: |
          dpkg-query -W -f='${binary:Package}\t${db:Status-Status}\n' \
            | awk '$2 == "installed" {print $1}' \
            | LC_ALL=C sort -u > /tmp/egress-packages-before
          python3 -c 'import json, zipfile'
      - name: Install secure panel only from Python-extracted ZIP
        run: |
          target="${{ matrix.os }}"
          ubuntu="${target#ubuntu-}"
          bundle="egress-manager-offline-ubuntu${ubuntu}-amd64"
          rm -rf /tmp/egress-offline-ci
          mkdir -p /tmp/egress-offline-ci
          python3 -m zipfile -e "dist/${bundle}.zip" /tmp/egress-offline-ci
          test -f "/tmp/egress-offline-ci/${bundle}/install.sh"
          test -f "/tmp/egress-offline-ci/${bundle}/install-core.sh"
          ipaddr="$(ip -4 route get 1.1.1.1 | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}')"
          test -n "${ipaddr}"
          sudo sh "/tmp/egress-offline-ci/${bundle}/install.sh" \
            --bundle-root "/tmp/egress-offline-ci/${bundle}" \
            --self-signed --ip "${ipaddr}"
      - name: Verify foreign proxy panels stayed untouched
        run: |
          sudo sha256sum -c /tmp/foreign-proxy-files.sha256
          for service in xray marzban x-ui; do
            systemctl is-active --quiet "${service}.service"
            printf '%s=%s\n' "${service}" "$(systemctl show --property=MainPID --value "${service}.service")"
          done > /tmp/foreign-proxy-pids.after
          diff -u /tmp/foreign-proxy-pids.before /tmp/foreign-proxy-pids.after
      - name: Verify installer removed no host packages
        run: |
          python3 -c 'import json, zipfile, ipaddress, tempfile'
          dpkg-query -W -f='${binary:Package}\t${db:Status-Status}\n' \
            | awk '$2 == "installed" {print $1}' \
            | LC_ALL=C sort -u > /tmp/egress-packages-after
          removed="$(comm -23 /tmp/egress-packages-before /tmp/egress-packages-after || true)"
          if [ -n "${removed}" ]; then
            printf 'Installer removed pre-existing host packages:\n%s\n' "${removed}" >&2
            exit 1
          fi
      - name: Verify services, runtimes, TLS, UI, manager, relay unit, and install log
        run: |
          sudo /usr/local/lib/egress-manager/verify.sh
          test "$(systemctl show egress-web.service --property=User --value)" = "egress-web"
          test "$(systemctl is-enabled egress-manager-xray-relay.service)" = "enabled"
          grep -Fq 'ConditionPathExists=/var/lib/egress-manager/private/xray-relay.json' /etc/systemd/system/egress-manager-xray-relay.service
          test "$(sudo stat -c '%a:%U:%G' /var/lib/egress-manager/private)" = "700:root:root"
          test "$(sudo stat -c '%a:%U:%G' /var/lib/egress-manager/database)" = "770:root:egress-manager"
          test "$(sudo stat -c '%a:%U:%G' /var/lib/egress-manager/database/egress-manager.db)" = "660:root:egress-manager"
          test -x /usr/local/lib/egress-manager/bin/sing-box
          test -x /usr/local/lib/egress-manager/bin/xray
          test -x /usr/local/lib/egress-manager/bin/lego
          test -x /usr/local/lib/egress-manager/tls-renew.sh
          test -x /usr/local/lib/egress-manager/manager.sh
          test -L /usr/local/bin/egress-manager
          test -f /usr/local/lib/egress-manager/web/index.html
          test -s /usr/local/lib/egress-manager/VERSION
          test "$(sed -n '1p' /usr/local/lib/egress-manager/VERSION)" = "ci"
          sudo grep -q '"listen_address": "0.0.0.0"' /etc/egress-manager/config.json
          sudo grep -q '"allow_insecure_http": false' /etc/egress-manager/config.json
          sudo grep -q '"xray_relay_config_path": "/var/lib/egress-manager/private/xray-relay.json"' /etc/egress-manager/config.json
          sudo grep -q '"tls_certificate_path": "/etc/egress-manager/tls/server.crt"' /etc/egress-manager/config.json
          sudo grep -q '"tls_private_key_path": "/etc/egress-manager/tls/server.key"' /etc/egress-manager/config.json
          test "$(sudo stat -c '%a:%U:%G' /etc/egress-manager/tls/server.key)" = "640:root:egress-manager"
          test "$(sudo sed -n '1p' /etc/egress-manager/tls/mode)" = "self-signed"
          ipaddr="$(sudo sed -n '1p' /etc/egress-manager/tls/ip-address)"
          sudo openssl x509 -in /etc/egress-manager/tls/server.crt -noout -ext subjectAltName | grep -Fq "IP Address:${ipaddr}"
          sudo /usr/local/bin/egress-manager --help >/dev/null
          sudo systemd-analyze verify \
            /etc/systemd/system/egressd.service \
            /etc/systemd/system/egress-web.service \
            /etc/systemd/system/egress-manager-sing-box.service \
            /etc/systemd/system/egress-manager-xray-relay.service \
            /etc/systemd/system/egress-manager-cert-renew.service \
            /etc/systemd/system/egress-manager-cert-renew.timer
          latest_log="$(sudo sh -c 'ls -1t /var/log/egress-manager/install-*.log | head -n 1')"
          test -n "${latest_log}"
          sudo grep -q '==> Install runtime and application files' "${latest_log}"
          sudo grep -q '==> Start and verify services' "${latest_log}"
          sudo grep -q 'Health check: OK' "${latest_log}"
      - name: Verify browser login uses HTTPS and Secure cookie
        run: |
          port="$(sudo sed -n 's/^[[:space:]]*"listen_port":[[:space:]]*\([0-9][0-9]*\),*$/\1/p' /etc/egress-manager/config.json)"
          printf '%s\n' 'ci-password-12345' | sudo /usr/local/lib/egress-manager/bin/egress-web provision-admin --username ci-admin --password-stdin
          rm -f /tmp/egress-cookies /tmp/egress-headers
          curl -k --fail --silent --show-error \
            -D /tmp/egress-headers \
            -c /tmp/egress-cookies \
            -H 'Content-Type: application/json' \
            --data '{"username":"ci-admin","password":"ci-password-12345"}' \
            "https://127.0.0.1:${port}/api/v1/auth/login" >/tmp/egress-login.json
          grep -qi '^Set-Cookie: egress_session=' /tmp/egress-headers
          grep -qi '^Set-Cookie:.*; Secure' /tmp/egress-headers
          curl -k --fail --silent --show-error -b /tmp/egress-cookies "https://127.0.0.1:${port}/api/v1/session" >/dev/null
          curl -k --fail --silent --show-error "https://127.0.0.1:${port}/login" | grep -q 'id="root"'
      - name: Verify manager keeps public exposure on HTTPS
        run: |
          sudo egress-manager expose
          sudo grep -q '"listen_address": "0.0.0.0"' /etc/egress-manager/config.json
          sudo grep -q '"allow_insecure_http": false' /etc/egress-manager/config.json
          sudo egress-manager url | grep -q '^Panel: https://'
      - name: Verify repeat secure install preserves administrator
        run: |
          target="${{ matrix.os }}"
          ubuntu="${target#ubuntu-}"
          bundle="egress-manager-offline-ubuntu${ubuntu}-amd64"
          ipaddr="$(sudo sed -n '1p' /etc/egress-manager/tls/ip-address)"
          sudo sh "/tmp/egress-offline-ci/${bundle}/install.sh" \
            --bundle-root "/tmp/egress-offline-ci/${bundle}" \
            --self-signed --ip "${ipaddr}"
          test "$(sed -n '1p' /usr/local/lib/egress-manager/VERSION)" = "ci"
          sudo sha256sum -c /tmp/foreign-proxy-files.sha256
          for service in xray marzban x-ui; do
            systemctl is-active --quiet "${service}.service"
            printf '%s=%s\n' "${service}" "$(systemctl show --property=MainPID --value "${service}.service")"
          done > /tmp/foreign-proxy-pids.repeat
          diff -u /tmp/foreign-proxy-pids.before /tmp/foreign-proxy-pids.repeat
          port="$(sudo sed -n 's/^[[:space:]]*"listen_port":[[:space:]]*\([0-9][0-9]*\),*$/\1/p' /etc/egress-manager/config.json)"
          curl -k --fail --silent --show-error \
            -c /tmp/egress-cookies-after-upgrade \
            -H 'Content-Type: application/json' \
            --data '{"username":"ci-admin","password":"ci-password-12345"}' \
            "https://127.0.0.1:${port}/api/v1/auth/login" >/dev/null
          curl -k --fail --silent --show-error -b /tmp/egress-cookies-after-upgrade "https://127.0.0.1:${port}/api/v1/session" >/dev/null

  network-lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned network lab
        run: docker build --tag egress-manager-network-lab --file tests/network/Dockerfile .
      - name: Run repeatable namespace lab
        run: docker run --rm --privileged egress-manager-network-lab
