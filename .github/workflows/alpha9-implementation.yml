name: Alpha.9 relay integration

on:
  push:
    branches:
      - feat/listener-egress-relay-alpha9
    paths:
      - scripts/dev/alpha9_ci_fix.py
      - .github/workflows/alpha9-implementation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message || '', '[alpha9-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/listener-egress-relay-alpha9
          fetch-depth: 0
      - name: Apply deterministic Alpha.9 CI fixes
        run: python3 scripts/dev/alpha9_ci_fix.py
      - name: Format Go test
        run: gofmt -w internal/xrayrelay/native_test.go
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo 'No Alpha.9 CI changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/install/install-secure.sh internal/xrayrelay/native_test.go web/tests/usability.spec.ts web/tests/design-system.spec.ts
          git commit -m 'Fix Alpha.9 CI regressions [alpha9-generated]'
          git push origin HEAD:feat/listener-egress-relay-alpha9
