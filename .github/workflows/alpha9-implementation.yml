name: Alpha.9 relay integration

on:
  push:
    branches:
      - feat/listener-egress-relay-alpha9
    paths:
      - scripts/dev/alpha9_ui_fix.py
      - .github/workflows/alpha9-implementation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message || '', '[alpha9-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/listener-egress-relay-alpha9
          fetch-depth: 0
      - name: Apply remaining UI regression patch
        run: python3 scripts/dev/alpha9_ui_fix.py
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit generated UI regression fix
        run: |
          if git diff --quiet; then
            echo 'No UI changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/tests/design-system.spec.ts
          git commit -m 'Update shell regression coverage for relays [alpha9-generated]'
          git push origin HEAD:feat/listener-egress-relay-alpha9
