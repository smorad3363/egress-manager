recent_decisions:
  - English roadmap is authoritative; Persian copy is reference-only.
  - Git and STATE.yaml are the primary recovery mechanism.
  - Go 1.27.1 verification uses the official Docker image because the Windows download endpoint returned HTTP 404.
  - Network integration runs entirely inside disposable namespaces and modifies no host firewall table.
  - SQLite uses go-sqlite3 with CGO; rationale and build risk are recorded in ADR 0001.
  - Non-loopback panel listeners require TLS; browser sessions always use secure cookies.
  - The IPC key is domain-separated before use for login-throttle buckets.
  - Inventory probes use fixed executables and arguments, bounded output, and per-command timeouts without a shell.
  - nftables candidates replace only egm_nat4 or egm_nat6 and are validated natively before apply.
  - NAT operations are journaled before mutation and interrupted operations recover by restoring the owned-table snapshot.
  - Port-forward desired state uses revisioned SQLite rows and keyset pagination; mutation remains separate from privileged apply.
  - Traffic counters are read from stable owned-rule comments through bounded nftables JSON output.
  - nftables remains primary; existing owned iptables state remains on the compatibility adapter until explicitly migrated.
  - Ambiguous simultaneous owned state across nftables and iptables is rejected instead of guessed.
  - HAProxy runs as a dedicated project-owned instance with its own configuration, PID file, and Runtime API socket.
  - HAProxy frontend/backend references use a normalized link table so referenced backends cannot be deleted silently.
  - HAProxy validation uses a secure temporary file; apply uses atomic rename and dedicated daemon-mode master-worker graceful reload.
  - HAProxy statistics use only the Unix Runtime API with bounded typed parsing; no statistics web port is opened.
  - Outbound desired state remains adapter-neutral; sing-box is the first adapter rather than the domain abstraction.
  - Outbound public metadata stores only secret presence or references; secret values never enter plan, logs, API responses, or UI state.
  - Outbound credential documents are encrypted with AES-256-GCM using a domain-separated key and outbound-ID-bound authenticated context.
  - SOCKS5 remains the generic domain type and maps to the sing-box adapter type socks at the adapter boundary.
  - Public sing-box plans expose only actions and hashes; candidate and recovery snapshots are encrypted in the operation journal.
  - WireGuard imports use the generic outbound model but render as sing-box endpoints because legacy WireGuard outbounds were removed in sing-box 1.13.
  - Native integration is pinned to official sing-box v1.13.20 by manifest digest.
  - sing-box apply requires the exact reviewed owned-state and candidate hashes; stale UI plans are rejected.
  - Generated sing-box candidates share the 128 KiB encrypted-journal bound so every valid plan is journalable before mutation.
  - Egress-route failure policy defaults to block; direct routing is permitted only when explicitly configured.
  - Enabled routes use a partial unique source index; primary and fallback outbound foreign keys are separately indexed and restrictive.
  - IPv4 subnet selectors resolve to exactly one active ingress interface so opposite-family blocking can be enforced without ambiguous client identity.
  - Route tables and rule priorities are deterministic per route but skip all foreign numeric tables and priorities discovered by inventory.
  - Follow-outbound DNS requires one to four explicit safe resolver addresses and never inherits host DNS implicitly.
  - Routed sing-box uses dedicated project-owned TUN inbounds with auto_route disabled; Egress Manager remains the sole owner of kernel routes and leak-control rules.
  - Policy routes and rules use protocol 242 as an ownership marker; verified prior owned resources are reusable, while foreign collisions force a different bounded slot.
  - The only routing firewall table is inet egm_egress; native candidates are validated and exercised inside the disposable privileged network lab.
  - Route apply is one journaled transaction across sing-box, nftables, IPv4/IPv6 policy routing, and the owned routing state file; each recovery snapshot is independently authenticated.
  - Apply installs the new kill-switch table before moving traffic, verifies TUN creation before policy rules, and restores prior sing-box, policy routes, nftables, and state after failure or restart.
  - Route plan and apply rebuild inside egressd; HTTP apply requires all six reviewed state/candidate hashes and never accepts a client-supplied native candidate.
  - Existing outbound-only apply preserves active routed TUN intents from the owned routing state instead of silently removing them.
  - Phase 8 no-leak tests use a dual-stack source subnet, kill the generated TUN, and assert zero direct-egress client packets with tcpdump while DNS and IPv6 are blocked.
  - Xray-family integrations begin read-only and remain read-only unless a native managed-fragment or documented API boundary is positively identified.
  - Xray discovery inspects only fixed standalone, Marzban, and 3x-ui paths; every discovered configuration remains foreign-owned and read-only.
  - Multiple configuration candidates for one service are rejected as ambiguous instead of selecting a path heuristically.
  - Version probes use only fixed Xray executable candidates and service probes use fixed systemctl arguments without invoking a shell.
  - Managed fragments are allowed only for a loaded standalone xray.service whose simple ExecStart positively proves one absolute -confdir matching the discovered configuration root and no explicit -config input.
  - Safe Xray composition supports bounded all-JSON confdirs only, rejects files ordered after the reserved fragment, and hashes every foreign filename and byte before planning.
  - The owned Xray fragment prepends exact native inboundTag-to-outboundTag rules while copying the effective foreign routing object; the foreign rules and routing fields remain in their original order and content model.
  - Xray native validation runs against a private 0700 temporary confdir containing byte-for-byte foreign snapshots plus only the candidate owned fragment; validation output is bounded and never persisted.
  - Xray fragment apply journals authenticated snapshots before mutation, rechecks both foreign and owned hashes, uses atomic replacement, restarts and verifies xray.service, and rolls back or recovers interrupted operations.
  - Rollback restores or removes only the reserved owned fragment; detected concurrent foreign changes are reported without overwriting any foreign file.
  - Native Xray bindings use optimistic revisions and keyset pagination; a partial unique index permits at most one enabled binding per inbound tag.
  - Privileged Xray apply rebuilds discovery, confdir snapshot, and desired bindings inside egressd and requires all three exact reviewed hashes.
  - HTTP exposes authenticated discovery and revisioned binding CRUD; all mutations, plan, and apply require CSRF protection, and candidates are never returned.
  - Daemon startup recovers Xray transactions only after rediscovering exactly one supported writable standalone installation; ambiguous or missing recovery boundaries fail closed.
  - The Xray console exposes explicit writable/read-only discovery, revisioned binding CRUD, owned-action review, and exact-three-hash apply without exposing native candidates.
  - Representative fixtures are validated with official Xray v26.7.28 after verifying the published SHA-256 digest 8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40.
  - The operator runbook documents loader preparation, ownership limits, stale-plan behavior, restart impact, rollback, and recovery.
  - Native VPNs extend the generic outbound abstraction through a separate interface adapter instead of being forced through sing-box.
  - Interface-outbound imports reject configuration features that can mutate foreign routes, DNS, execute programs, or escape the owned lifecycle boundary.
  - Native interface lifecycle must be prepared before policy traffic moves and rolled back after owned route state in reverse dependency order.
  - The existing outbound table and enabled-adapter-ID index already cover native adapter persistence, so Phase 10 adds no schema migration.
  - WireGuard imports accept exactly one peer and reject wg-quick hooks, DNS, SaveConfig, and automatic table ownership.
  - OpenVPN imports accept only one TUN client remote with inline credential material and normalize `nobind`, `route-nopull`, and a deterministic owned device name.
  - Native lifecycle state stores only owned IDs, interface/service names, addresses, MTU, and authenticated configuration hashes; runtime secret files remain private.
  - sing-box plans validate but omit interface-adapter outbounds, preventing native VPN credentials or definitions from entering sing-box candidates.
  - Native interface lifecycle uses encrypted journal snapshots, authenticated runtime configuration hashes, atomic files, fixed commands, bounded waits, reverse rollback, and restart recovery.
  - OpenVPN clients run as hardened project-named transient systemd services and are recreated from encrypted desired state after reboot; no plaintext profile is persisted outside the private runtime directory.
  - Native interface import, plan, and exact-two-hash apply are exposed through privileged IPC and authenticated CSRF-protected HTTP operations; candidate profiles remain private to egressd.
  - Interface state and runtime configuration paths are absolute, distinct, and constrained to the private runtime directory with backward-compatible defaults.
  - Native routes use the exact verified project-owned interface and are omitted from sing-box TUN generation; incompatible direct fallback is rejected.
  - Coordinated route review and apply bind the exact native interface state hash and refuse to move traffic until desired interface lifecycle state is already applied.
  - Native health validates the private profile, verifies owned lifecycle state, reports WireGuard handshake evidence or active OpenVPN service state, and leaves internet reachability explicitly untested.
  - WireGuard endpoint bypasses use throw routes so outer packets continue through the host route while the owned nftables kill switch prevents client fallback leaks.
  - Native OpenVPN validation uses the standalone --show-tls configuration parser; --test-crypto is intentionally excluded because OpenVPN 2.6 requires a shared-secret key for that mode.
  - The disposable lab uses kernel WireGuard end to end on standard Linux; on WSL2 it validates kernel interface and peer lifecycle, then uses isolated point-to-point transport for routing assertions because kernel-created UDP sockets cannot use mirrored networking reliably.
  - Phase 11 composes existing authenticated subsystem journals and ownership-safe mutation paths rather than replacing them with a parallel recovery mechanism.
  - Emergency bypass removes only Egress Manager-owned interception and routing; it never flushes foreign firewall or route state.
  - All host-network apply paths and startup recovery share one nonblocking Linux flock; the kernel releases ownership after a crash while bounded metadata preserves operator diagnostics.
  - Recovery status never exposes protected previous snapshots, candidate configurations, credentials, or raw failure details.
  - CI executes the pinned Docker network lab instead of maintaining a divergent host dependency and probe list.
  - Startup and manual recovery use one dependency-ordered coordinator and fail if any unfinished journal entry remains after all known component recoverers run.
  - Recovery reports expose only step names, success flags, and timestamps; internal errors remain in privileged structured logs.
  - Global lock contention uses stable IPC code busy, CLI exit code 4, and HTTP 409 without falsely claiming rollback was attempted.
  - Startup and manual recovery replay only validated applied routing and sing-box state; pending database edits remain unapplied.
  - Reconciliation rollback restores validated nftables leak protection before policy routes when reboot erased the volatile snapshot.
  - Dependency monitoring is observational by default and has no direct mutation or reconciliation callback.

