recent_decisions:
  - English roadmap is authoritative; Persian copy is reference-only.
  - Git and STATE.yaml are the primary recovery mechanism.
  - Go 1.27.1 verification uses the official Docker image because the Windows download endpoint returned HTTP 404.
  - Network integration runs entirely inside disposable namespaces and modifies no host firewall table.
  - SQLite uses go-sqlite3 with CGO; rationale and build risk are recorded in ADR 0001.
  - Non-loopback panel listeners require TLS; browser sessions always use secure cookies.
  - The IPC key is domain-separated before use for login-throttle buckets.
  - Inventory probes use fixed executables and arguments, bounded output, and per-command timeouts without a shell.
  - nftables candidates replace only egm_nat4 or egm_nat6 and are validated natively before apply.
  - NAT operations are journaled before mutation and interrupted operations recover by restoring the owned-table snapshot.
  - Port-forward desired state uses revisioned SQLite rows and keyset pagination; mutation remains separate from privileged apply.
  - Traffic counters are read from stable owned-rule comments through bounded nftables JSON output.
  - nftables remains primary; existing owned iptables state remains on the compatibility adapter until explicitly migrated.
  - Ambiguous simultaneous owned state across nftables and iptables is rejected instead of guessed.
  - HAProxy runs as a dedicated project-owned instance with its own configuration, PID file, and Runtime API socket.
  - HAProxy frontend/backend references use a normalized link table so referenced backends cannot be deleted silently.
  - HAProxy validation uses a secure temporary file; apply uses atomic rename and dedicated daemon-mode master-worker graceful reload.
  - HAProxy statistics use only the Unix Runtime API with bounded typed parsing; no statistics web port is opened.
  - Outbound desired state remains adapter-neutral; sing-box is the first adapter rather than the domain abstraction.
  - Outbound public metadata stores only secret presence or references; secret values never enter plan, logs, API responses, or UI state.
  - Outbound credential documents are encrypted with AES-256-GCM using a domain-separated key and outbound-ID-bound authenticated context.
  - SOCKS5 remains the generic domain type and maps to the sing-box adapter type socks at the adapter boundary.
  - Public sing-box plans expose only actions and hashes; candidate and recovery snapshots are encrypted in the operation journal.
  - WireGuard imports use the generic outbound model but render as sing-box endpoints because legacy WireGuard outbounds were removed in sing-box 1.13.
  - Native integration is pinned to official sing-box v1.13.20 by manifest digest.
  - sing-box apply requires the exact reviewed owned-state and candidate hashes; stale UI plans are rejected.
  - Generated sing-box candidates share the 128 KiB encrypted-journal bound so every valid plan is journalable before mutation.
  - Egress-route failure policy defaults to block; direct routing is permitted only when explicitly configured.
  - Enabled routes use a partial unique source index; primary and fallback outbound foreign keys are separately indexed and restrictive.
  - IPv4 subnet selectors resolve to exactly one active ingress interface so opposite-family blocking can be enforced without ambiguous client identity.
  - Route tables and rule priorities are deterministic per route but skip all foreign numeric tables and priorities discovered by inventory.

